version: "3.8"

services:
  db:
    image: mariadb:10.11
    environment:
      MYSQL_DATABASE: chatdb
      MYSQL_USER: chatuser
      MYSQL_PASSWORD: chatpass
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
      - /mnt/gfs/chat/db:/var/lib/mysql
    networks:
      - dokploy-network
    deploy:
      replicas: 1

networks:
  dokploy-network:
    external: true   
