name: Build & Deploy ChatPHP

on:
  push:
    branches: [ "main" ]
    paths:
      - "src/**"
      - "Dockerfile"
      - ".github/workflows/deploy.yml"

jobs:
  build_push_deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ${{ secrets.IMAGE_NAME }}   # ex. mtorres14/chat-php
      REGISTRY: docker.io
      SHA_TAG: ${{ github.sha }}
      LATEST_TAG: latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWD }}

      - name: Define Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.LATEST_TAG }}
            type=raw,value=${{ env.SHA_TAG }}

      - name: Build & push Docker image
        uses: docker/build-push-action@v5
        with:
          push: true
          context: .
          file: ./Dockerfile
          tags: ${{ steps.meta.outputs.tags }}

      - name: Trigger Dokploy redeploy via webhook
        if: ${{ success() }}
        run: |
          curl -fsSL -X POST "${{ secrets.DOKPLOY_WEBHOOK_URL }}"
